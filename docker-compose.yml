services:
  # !!! ВАЖНО: frontend теперь ПЕРВЫЙ сервис в файле !!!
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    container_name: mood-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-/api}
      BACKEND_URL: ${BACKEND_URL:-backend:8000}
    depends_on:
      - backend
    networks:
      - mood-network
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:15-alpine
    container_name: mood-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodpass}
      POSTGRES_DB: ${POSTGRES_DB:-moodpixel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mood-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mood}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mood-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mood-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mood-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mood}:${POSTGRES_PASSWORD:-moodpass}@db:5432/${POSTGRES_DB:-moodpixel}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      VK_APP_ID: ${VK_APP_ID}
      VK_SECRET: ${VK_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://pixel-mood.onrender.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mood-network
    ports:
      - "8000:8000"

networks:
  mood-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: